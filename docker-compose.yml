version: '3.8'

services:

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.1
    container_name: docker-socket-proxy
    restart: unless-stopped
    logging:
      driver: "none"
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - CONTAINERS=1
      - EVENTS=1
      - NETWORKS=1
      - IMAGES=1
      - POST=1
      - PING=1
      - INFO=1
      - EXEC=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - dockflare-internal

  dockflare-init:
    image: alpine:3.20
    command: ["sh", "-c", "chown -R ${DOCKFLARE_UID:-65532}:${DOCKFLARE_GID:-65532} /app/data"]
    volumes:
      - dockflare_data:/app/data
    networks:
      - dockflare-internal
    restart: "no"

  dockflare:
    image: ghcr.io/ondarianenterprises/dockflare:stable
    container_name: dockflare
    restart: unless-stopped
    env_file: .env
    ports:
      - "5000:5000"
    labels:
      - dockflare.enable=true
      - dockflare.hostname=${DOCKFLARE_HOSTNAME}
      - dockflare.service=http://dockflare:5000
      # Uncomment to protect the UI with a Cloudflare Access group:
      #- dockflare.access.group=YOUR-ACCESS-GROUP-ID

      # OAuth callback bypass (required if DockFlare is behind an Access policy
      # and you use OAuth — e.g. Google/GitHub — to sign in to the UI):
      #- dockflare.0.hostname=${DOCKFLARE_HOSTNAME}
      #- dockflare.0.path=/auth/google/callback
      #- dockflare.0.service=http://dockflare:5000
      #- dockflare.0.access.group=public-default-bypass

      #- dockflare.1.hostname=${DOCKFLARE_HOSTNAME}
      #- dockflare.1.path=/auth/github/callback
      #- dockflare.1.service=http://dockflare:5000
      #- dockflare.1.access.group=public-default-bypass
    volumes:
      - dockflare_data:/app/data
    depends_on:
      docker-socket-proxy:
        condition: service_started
      dockflare-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks:
      - cloudflare-net
      - dockflare-internal

  redis:
    image: redis:7-alpine
    container_name: dockflare-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    logging:
      driver: "none"
    volumes:
      - dockflare_redis:/data
    networks:
      - dockflare-internal

  dockflare-mail-manager:
    image: alplat/dockflare-mail-manager:stable
    container_name: dockflare-mail-manager
    restart: unless-stopped
    profiles: ["email"]
    environment:
      - DOCKFLARE_MASTER_URL=${DOCKFLARE_MASTER_INTERNAL_URL:-http://dockflare:5000}
      - MAIL_DATA_PATH=/data
    volumes:
      - mail_data:/data
    depends_on:
      dockflare:
        condition: service_started
    networks:
      - cloudflare-net
      - dockflare-internal

  dockflare-webmail:
    image: ghcr.io/ondarianenterprises/dockflare-webmail:stable
    container_name: dockflare-webmail
    restart: unless-stopped
    profiles: ["email"]
    environment:
      - DOCKFLARE_MASTER_URL=${DOCKFLARE_MASTER_PUBLIC_URL}
    labels:
      - dockflare.enable=true
      - dockflare.hostname=${DOCKFLARE_MAIL_HOSTNAME}
      - dockflare.service=http://dockflare-webmail:80
    depends_on:
      dockflare-mail-manager:
        condition: service_started
    networks:
      - cloudflare-net
      - dockflare-internal

volumes:
  dockflare_data:
  dockflare_redis:
  mail_data:

networks:
  cloudflare-net:
    name: cloudflare-net
    external: true
  dockflare-internal:
    name: dockflare-internal
